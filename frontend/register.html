<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f6" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Cadastro</title>
  </head>
  <body data-page="register">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="form-title">
        <h1 id="form-title">Criar conta</h1>

        <form id="register-form" novalidate>
          <label for="name">Nome</label>
          <input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="100" required placeholder="Como podemos chamar você?" />

          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="voce@exemplo.com" />

          <label for="password">Senha <span class="label-hint">mínimo de 8 caracteres</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Crie uma senha" />

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button class="button button-primary" type="submit">Criar conta</button>
        </form>

        <p class="form-footer">Já tem conta? <a href="/">Entrar</a></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
