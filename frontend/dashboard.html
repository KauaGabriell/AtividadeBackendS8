<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3ed" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Sua área · Ponto de Partida</title>
  </head>
  <body data-page="dashboard">
    <main class="dashboard-shell">
      <section class="welcome-panel" aria-labelledby="welcome-title">
        <p class="eyebrow">Você está conectado</p>
        <h1 id="welcome-title">Olá, <span id="user-name">...</span>.</h1>
        <p class="intro-text">Esta é sua área pessoal. Seus dados vêm da API autenticada.</p>
        <div class="profile-detail">
          <span class="detail-label">E-mail da conta</span>
          <span class="detail-value" id="user-email">Carregando...</span>
        </div>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
