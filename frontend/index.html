<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f6" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Entrar</title>
  </head>
  <body data-page="login">
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="form-title">
        <h1 id="form-title">Entrar</h1>

        <form id="login-form" novalidate>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="voce@exemplo.com" />

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="Sua senha" />

          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
          <button class="button button-primary" type="submit">Entrar</button>
        </form>

        <p class="form-footer">Não tem conta? <a href="/register.html">Cadastre-se</a></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
